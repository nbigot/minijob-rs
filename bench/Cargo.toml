[package]
name = "minijob-bench"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
description = "Load generator for the minijob HTTP API (same scenarios and output as the Go version)"
license = "MIT"
publish = false

[dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
hyper = { version = "1.12", features = ["http1", "client"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http = "1.5"
http-body-util = "0.1.5"
bytes = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
